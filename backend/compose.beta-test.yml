name: secretaria-m04-test
services:
  postgres:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    container_name: secretaria_m04_postgres_test
    environment:
      POSTGRES_USER: secretaria_test
      POSTGRES_PASSWORD: fictional_test_only
      POSTGRES_DB: secretaria_m04_test
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["pg_test:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretaria_test -d secretaria_m04_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8.2@sha256:99ffb973380cc2f47bca06bd094f7f8c7138a0879a63cb8939896a22b7a65bba
    container_name: secretaria_m04_redis_test
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports: ["127.0.0.1:6381:6379"]
    volumes: ["redis_test:/data"]
volumes:
  pg_test:
  redis_test:
