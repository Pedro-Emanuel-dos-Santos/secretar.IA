services:
  postgres:
    image: postgres:16
    container_name: secretaria_ia_db
    restart: always
    environment:
      POSTGRES_USER: secretaria
      POSTGRES_PASSWORD: secretaria123
      POSTGRES_DB: secretaria_ia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: secretaria_ia_redis
    restart: always
    ports:
      - "6379:6379"

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: secretaria_ia_evolution
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080

      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: secretaria_ia_123
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://secretaria:secretaria123@postgres:5432/evolution_api?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: secretaria_ia_evolution

      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"

      LOG_LEVEL: ERROR

    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  evolution_instances: