services:
  postgres:
    image: postgres:16
    container_name: secretaria_ia_db
    restart: always
    environment:
      POSTGRES_USER: secretaria
      POSTGRES_PASSWORD: secretaria123
      POSTGRES_DB: secretaria_ia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: