name: secretaria-backup-test
services:
  pg-test:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: backup_fixture
      POSTGRES_PASSWORD: fictional_backup_only
      POSTGRES_DB: secretaria_backup_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U backup_fixture -d secretaria_backup_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [fixtures]
  redis-test:
    image: redis:8.2@sha256:99ffb973380cc2f47bca06bd094f7f8c7138a0879a63cb8939896a22b7a65bba
    command: ["redis-server", "--appendonly", "no", "--save", "60", "1", "--requirepass", "fictional_redis_only"]
    networks: [fixtures]
  tests:
    build: .
    entrypoint: ["python3", "-m", "unittest", "-v", "test_backup", "test_executor"]
    environment:
      BACKUP_MODE: fixture
      PGHOST: pg-test
      PGPORT: "5432"
      PGDATABASE: secretaria_backup_test
      PGUSER: backup_fixture
      PGPASSWORD: fictional_backup_only
      PGSSLMODE: disable
      BACKUP_REDIS_HOST: redis-test
      BACKUP_REDIS_PORT: "6379"
      REDISCLI_AUTH: fictional_redis_only
    depends_on:
      pg-test: {condition: service_healthy}
      redis-test: {condition: service_started}
    networks: [fixtures]
networks:
  fixtures:
    internal: true
